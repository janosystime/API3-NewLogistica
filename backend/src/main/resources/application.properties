spring.application.name=backend

# ===========================================
# Banco de dados
# Padrão agora é MySQL (alinhado com a stack oficial do projeto).
# Para voltar a rodar com H2 (teste rápido sem MySQL instalado),
# comente o bloco MySQL e descomente o bloco H2.
# ===========================================

# --- MySQL (padrão) ---
spring.datasource.url=jdbc:mysql://localhost:3306/fleetops?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- H2 (alternativa para dev / teste rápido sem MySQL) ---
# spring.datasource.url=jdbc:h2:mem:fleetops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
